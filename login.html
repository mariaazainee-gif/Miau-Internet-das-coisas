/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;outline:none;font-family:'Quicksand',sans-serif}
input{outline:none;font-family:'Quicksand',sans-serif}
img{max-width:100%;display:block}

/* ── Tela inteira: fundo fixo com a imagem ── */
.pagina {
  min-height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

/* Camada 2: overlay escuro para contraste */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: linear-gradient(
    160deg,
    rgba(20,45,35,.55) 0%,
    rgba(15,38,28,.78) 55%,
    rgba(10,30,20,.90) 100%
  );
}

/* Camada 3: conteúdo acima de tudo */
.conteudo {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Logo + Nome do app ── */
.topo {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 28px;
}

/* Logo com borda arredondada e sombra */
.logo-img {
  width: 110px;
  height: 110px;
  object-fit: contain;
  border-radius: 28px;
  background: rgba(255,255,255,.92);
  padding: 10px;
  box-shadow:
    0 8px 32px rgba(0,0,0,.45),
    0 2px 8px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.8);
  animation: flutuar 3.5s ease-in-out infinite;
  margin-bottom: 14px;
}
@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Nome do app com destaque garantido */
.app-nome {
  font-family: 'Baloo 2', cursive;
  font-size: 2.6rem;
  font-weight: 900;
  color: #fff;
  letter-spacing: -1px;
  line-height: 1;
  text-shadow:
    0 3px 14px rgba(0,0,0,.7),
    0 1px 4px rgba(0,0,0,.5);
}
.app-slogan {
  font-size: .875rem;
  font-weight: 600;
  color: rgba(255,255,255,.8);
  margin-top: 4px;
  letter-spacing: .3px;
  text-shadow: 0 1px 6px rgba(0,0,0,.55);
}

/* ── Card do formulário ── */
.card {
  width: 100%;
  background: #ffffff;
  border-radius: 24px;
  padding: 30px 26px 34px;
  box-shadow:
    0 24px 64px rgba(0,0,0,.32),
    0 8px 24px rgba(0,0,0,.18);
}

/* Handle do topo (estilo sheet nativo) */
.card-handle {
  width: 38px; height: 4px;
  background: #d1d8d4; border-radius: 2px;
  margin: 0 auto 22px;
}

.card-titulo {
  font-family: 'Baloo 2', cursive;
  font-size: 1.45rem; font-weight: 800;
  color: #2c3a35; text-align: center;
  margin-bottom: 6px;
}
.card-sub {
  font-size: .875rem; font-weight: 600;
  color: #6b7c85; text-align: center;
  line-height: 1.55; margin-bottom: 24px;
}

/* ── Campos ── */
.campo { margin-bottom: 14px; }
.campo label {
  display: block; font-size: .8125rem; font-weight: 700;
  color: #3d6b5e; margin-bottom: 6px;
}
.campo input {
  width: 100%;
  background: #f2f6f4;
  border: 1.5px solid rgba(61,107,94,.18);
  border-radius: 14px;
  padding: 13px 16px;
  color: #2c3a35; font-size: .9375rem; font-weight: 600;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.campo input:focus {
  border-color: #5a9e8f;
  box-shadow: 0 0 0 4px rgba(90,158,143,.14);
  background: #fff;
}
.campo input::placeholder { color: #c4d0cc; font-weight: 500; }

.link-esqueci {
  display: block; text-align: right;
  font-size: .8125rem; font-weight: 700;
  color: #5a9e8f; cursor: pointer;
  margin-top: -6px; margin-bottom: 20px;
  transition: color .15s;
}
.link-esqueci:hover { color: #3d6b5e; }

/* ── Botões ── */
.btn-principal {
  width: 100%; padding: 15px;
  border-radius: 16px;
  background: linear-gradient(135deg, #3d6b5e, #5a9e8f);
  color: #fff; font-family: 'Baloo 2', cursive;
  font-size: 1.05rem; font-weight: 700;
  box-shadow: 0 6px 20px rgba(61,107,94,.38);
  transition: transform .15s, box-shadow .15s;
  position: relative; overflow: hidden;
}
.btn-principal:hover  { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(61,107,94,.48); }
.btn-principal:active { transform: scale(.97); }
.btn-principal:disabled { background: #c4d0cc; color: #6b7c85; box-shadow: none; cursor: not-allowed; transform: none; }

.divisor {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0; color: #c4d0cc; font-size: .8125rem; font-weight: 700;
}
.divisor::before,.divisor::after { content:''; flex:1; height:1.5px; background:rgba(61,107,94,.12); }

.btn-google {
  width: 100%; padding: 13px;
  border-radius: 16px;
  background: rgba(61,107,94,.07);
  color: #2c3a35; font-family: 'Baloo 2', cursive;
  font-size: 1rem; font-weight: 700;
  border: 1.5px solid rgba(61,107,94,.18);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .2s, transform .15s;
}
.btn-google:hover { background: rgba(61,107,94,.13); transform: translateY(-1px); }

.rodape {
  text-align: center; margin-top: 20px;
  font-size: .8125rem; color: #6b7c85; font-weight: 600;
}
.rodape span { color: #3d6b5e; font-weight: 700; cursor: pointer; }

/* ── Toast ── */
#area-toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  background: #fff; border: 1.5px solid rgba(61,107,94,.15);
  border-radius: 50px; padding: 10px 20px;
  font-size: .8125rem; font-weight: 700; color: #2c3a35;
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,.14);
  animation: tIn .3s ease, tOut .3s ease 2.5s forwards;
}
@keyframes tIn  { from{opacity:0;transform:translateY(-10px) scale(.94)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes tOut { from{opacity:1} to{opacity:0;transform:translateY(-10px)} }
</style>
</head>
<body>
<div id="area-toast"></div>

<!-- Camada 1: imagem de fundo -->
<div class="fundo"></div>
<!-- Camada 2: overlay escuro -->
<div class="overlay"></div>

<!-- Camada 3: conteúdo -->
<main class="pagina">
  <div class="conteudo">

    <!-- Logo + nome do app -->
    <div class="topo">
      <img
        src="/assets/img/logo.png"
        alt="Logo MiAU"
        class="logo-img"
      />
      <div class="app-nome">MiAU</div>
      <div class="app-slogan">Comedouro Inteligente para Pet 🐾</div>
    </div>

    <!-- Card do formulário -->
    <div class="card">
      <div class="card-handle"></div>
      <h2 class="card-titulo">Bem-vindo! 👋</h2>
      <p class="card-sub">Cuide do seu pet mesmo de longe,<br/>com carinho e praticidade.</p>

      <div class="campo">
        <label for="campo-email">Seu e-mail</label>
        <input id="campo-email" type="email" placeholder="voce@email.com" autocomplete="email"/>
      </div>
      <div class="campo">
        <label for="campo-senha">Sua senha</label>
        <input id="campo-senha" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <span class="link-esqueci" onclick="recuperarSenha()">Esqueci minha senha</span>

      <button id="btn-entrar" class="btn-principal" onclick="fazerLogin()">Entrar</button>

      <div class="divisor">ou</div>

      <button class="btn-google" onclick="entrarComGoogle()"><img src="/assets/icons/mycollection/png/011-google.png" alt="Google" width="30px" height="30" /> Entrar com Google</button>

      <p class="rodape">
        Não tem conta? <span onclick="irParaCadastro()">Cadastre-se grátis</span>
      </p>
    </div>

  </div>
</main>

<script>
/* ── Exibe mensagem flutuante ── */
function exibirToast(msg, dur=3000) {
  const area = document.getElementById('area-toast');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  area.appendChild(el);
  setTimeout(() => el.remove(), dur + 400);
}

/* ── Valida e-mail ── */
function validarEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

/* ── Extrai primeiro nome do e-mail ── */
function nomeDoEmail(e) {
  const p = e.split('@')[0].split('.')[0];
  return p.charAt(0).toUpperCase() + p.slice(1);
}

/* ── Marcar campo com erro ── */
function marcarErro(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.borderColor = '#e07070';
  el.focus();
  setTimeout(() => el.style.borderColor = '', 3000);
  exibirToast('⚠️ ' + msg);
}

/* ── Login ── */
function fazerLogin() {
  const email = document.getElementById('campo-email').value.trim();
  const senha = document.getElementById('campo-senha').value;
  if (!validarEmail(email)) { marcarErro('campo-email','Digite um e-mail válido.'); return; }
  if (!senha || senha.length < 4) { marcarErro('campo-senha','Senha com mínimo 4 caracteres.'); return; }
  const btn = document.getElementById('btn-entrar');
  btn.textContent = 'Entrando...'; btn.disabled = true;
  setTimeout(() => {
    try { sessionStorage.setItem('miau_usuario', email); sessionStorage.setItem('miau_nome', nomeDoEmail(email)); } catch(e){}
    window.location.href = 'setup.html';
  }, 800);
}

/* ── Google ── */
function entrarComGoogle() {
  try { sessionStorage.setItem('miau_usuario','usuario@gmail.com'); sessionStorage.setItem('miau_nome','Tutor MiAU'); } catch(e){}
  window.location.href = 'setup.html';
}

/* ── Placeholders ── */
function recuperarSenha() { exibirToast('📧 Link de recuperação enviado!'); }
function irParaCadastro() { exibirToast('🚧 Cadastro em breve!'); }

/* ── Redireciona se já estiver logado ── */
try { if (sessionStorage.getItem('miau_usuario')) window.location.href = 'setup.html'; } catch(e){}
</script>
</body>
</html>
